<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>SETU — Voice First Assistant</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="app-viewport" id="app-viewport">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-block">
        <div class="soundwave-logo" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1 class="brand-title">SETU</h1>
      </div>
      <p class="brand-tagline">Voice First. Always.</p>
      
      <div class="status-pill" id="main-status-pill" role="status" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span class="pill-text" id="status-text">Standby (Say “Start SETU”)</span>
      </div>
    </header>

    <!-- Main START / STOP Master Control Button -->
    <section class="master-control-section" aria-label="Master Power Control">
      <button class="master-power-btn btn-start" id="btn-master-toggle" type="button" aria-label="Start SETU or say Start SETU">
        <div class="power-icon-circle" aria-hidden="true">
          <span class="power-glyph" id="power-glyph">▶</span>
        </div>
        <div class="power-text-wrap">
          <span class="power-main-label" id="power-main-label">START SETU</span>
          <span class="power-sub-label" id="power-sub-label">Say “Start SETU” or tap here</span>
        </div>
      </button>
    </section>

    <!-- Active Live Viewfinder & Safety HUD (Revealed when active) -->
    <section class="active-hud-section" id="active-hud-section" aria-label="Live Vision and Safety Status">
      <!-- Camera Viewfinder -->
      <div class="camera-card">
        <video id="camera" playsinline autoplay muted aria-label="Camera stream"></video>
        <div class="hud-overlay" aria-hidden="true">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <div class="scanner-laser"></div>
        </div>
      </div>

      <!-- Reactive Mode & Safety Card -->
      <div id="mode-card" class="reactive-mode-card" data-state="clear" role="status" aria-live="assertive">
        <div class="mode-card-inner">
          <div id="mode-icon" class="mode-icon">🛡️</div>
          <div class="mode-text-wrap">
            <h2 id="mode-label" class="mode-label">Collision Watch</h2>
            <p id="mode-detail" class="mode-detail">Path is clear. Say any command.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Gesture Guide Bar (Requested Exact Layout) -->
    <section class="gesture-guide-bar" aria-label="Gesture Controls">
      <div class="guide-item"><span class="guide-key">Double Tap</span> Speak</div>
      <div class="guide-item"><span class="guide-key">Swipe ↔</span> Switch Mode</div>
      <div class="guide-item"><span class="guide-key">2-Finger Tap</span> Silence</div>
      <div class="guide-item"><span class="guide-key">Hold 1s</span> Stop Alert</div>
    </section>

    <!-- Feature Shortcuts Grid (Available when SETU is running) -->
    <nav class="feature-shortcuts-grid" aria-label="Feature Shortcuts">
      <button class="feat-pill" data-cmd="navigate" type="button" aria-label="Navigate mode">
        <span class="feat-icon">🧭</span> Navigate
      </button>
      <button class="feat-pill" data-cmd="currency" type="button" aria-label="Money currency mode">
        <span class="feat-icon">₹</span> Money
      </button>
      <button class="feat-pill" data-cmd="read" type="button" aria-label="Read text mode">
        <span class="feat-icon">📖</span> Read
      </button>
      <button class="feat-pill" data-cmd="objects" type="button" aria-label="Explore objects mode">
        <span class="feat-icon">📦</span> Explore
      </button>
      <button class="feat-pill" data-cmd="describe" type="button" aria-label="Describe scene mode">
        <span class="feat-icon">👁️</span> Describe
      </button>
      <button class="feat-pill" data-cmd="learn" type="button" aria-label="Learn audio tutor">
        <span class="feat-icon">🎓</span> Learn
      </button>
    </nav>

    <!-- Live Speech & AI Feedback Banner -->
    <footer class="live-feedback-footer" role="region" aria-label="Live Voice Transcript">
      <div class="feedback-header">
        <span class="speaker-icon" aria-hidden="true">🔊</span>
        <span class="feedback-title">LIVE FEEDBACK</span>
      </div>
      <p id="transcript" class="transcript-text" role="status" aria-live="assertive">Say “Start SETU” to begin.</p>
    </footer>

    <!-- Hidden compatibility elements for existing background streams -->
    <div style="display:none;" aria-hidden="true">
      <span id="listen-badge"></span>
      <p id="footer-status"></p>
    </div>

  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
