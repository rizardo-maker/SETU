<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SETU</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Voice-first UI: no mode buttons. Default/idle state is "nothing
       running" — every mode, including proximity detection, is a
       one-shot scan invoked by a bare command word ("currency",
       "describe", "read", "question", "detect") and returns to idle
       when done. Screen shows what's happening for sighted judges. -->

  <header class="topbar">
    <h1>SETU</h1>
    <span id="listen-badge" class="badge" aria-live="polite">Initializing…</span>
  </header>

  <main>
    <video id="camera" playsinline autoplay muted></video>

    <!-- Central status pane — swaps between "idle" and "current mode
         running" states, always human-readable. -->
    <div id="mode-card" class="mode-card" role="status" aria-live="polite">
      <div id="mode-icon" class="mode-icon">🎙️</div>
      <div id="mode-label" class="mode-label">Ready</div>
      <div id="mode-detail" class="mode-detail">Say a command, or tap one below.</div>
    </div>

    <!-- Command hint line — reminds the user what to say. Each command
         word is also a real, tappable button wired to the exact same
         dispatch path voice uses (see app.js _bindCommandButtons), so a
         sighted user or someone in a loud room can invoke a mode with a
         tap instead of speaking. -->
    <p id="wake-hint" class="wake-hint">
      Say or tap
      <button type="button" class="cmd-word" data-cmd="currency">“currency”</button>,
      <button type="button" class="cmd-word" data-cmd="describe">“describe”</button>,
      <button type="button" class="cmd-word" data-cmd="read">“read”</button>,
      <button type="button" class="cmd-word" data-cmd="question">“question”</button>, or
      <button type="button" class="cmd-word" data-cmd="detect">“detect”</button>.
    </p>

    <!-- Live transcription of the latest utterance heard from the browser's
         speech recogniser. Purely diagnostic for sighted use. -->
    <p id="transcript" role="status" aria-live="assertive"></p>

    <!-- Small footer: tier2 (Gemma) reachability status. -->
    <p id="footer-status" class="footer-status">Waiting for camera.</p>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
