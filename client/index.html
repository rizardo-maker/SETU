<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SETU</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Voice-first UI: no mode buttons. Default state is continuous
       collision detection; the wake phrase "hey setu <command>"
       invokes single-shot modes (currency / describe / read / question)
       and returns to collision. Screen shows what's happening for
       sighted judges + emergencies. -->

  <header class="topbar">
    <h1>SETU</h1>
    <span id="listen-badge" class="badge" aria-live="polite">Initializing…</span>
  </header>

  <main>
    <video id="camera" playsinline autoplay muted></video>

    <!-- Central status pane — swaps between "collision status" and
         "current mode running" states, always human-readable. -->
    <div id="mode-card" class="mode-card" role="status" aria-live="polite">
      <div id="mode-icon" class="mode-icon">🛡️</div>
      <div id="mode-label" class="mode-label">Collision watch</div>
      <div id="mode-detail" class="mode-detail">Path is clear.</div>
    </div>

    <!-- Wake helper line — reminds the user what to say, always visible. -->
    <p id="wake-hint" class="wake-hint">
      Say <b>“currency”</b>, <b>“describe”</b>, <b>“read”</b>, or <b>“question”</b>.
      Say <b>“stop”</b> (or tap the card) to mute alerts.
    </p>

    <!-- Live transcription of the latest utterance heard from the browser's
         speech recogniser. Purely diagnostic for sighted use. -->
    <p id="transcript" role="status" aria-live="assertive"></p>

    <!-- Small footer: last collision alert time & tier2 (Gemma) status. -->
    <p id="footer-status" class="footer-status">Waiting for camera.</p>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
